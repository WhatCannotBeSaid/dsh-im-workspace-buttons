name: publish

# 只在 push 形如 v1.0.2 的 tag 时发布。
#
# 认证走 OIDC trusted publishing：工作流里没有任何 npm token，也不需要
# NPM_TOKEN secret。前提：npm 包设置 → Trusted Publisher 里登记
#   Publisher            GitHub Actions
#   Organization / User  WhatCannotBeSaid
#   Repository           dsh-im-workspace-buttons
#   Workflow filename    publish.yml
#   Environment          （留空）
#
# 本包零运行时依赖，所以不需要 npm ci；发布物是提交里的构建结果。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC 必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: 校验 tag 与 package.json 版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -e "process.stdout.write(require('./package.json').version)")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag 与 package.json 的 $pkg 不一致，拒绝发布" >&2
            exit 1
          fi

      - name: 校验 client.js 的 runtime 段与 src/runtime.js 一致
        run: node tools/build-client.mjs --check

      - name: 跑行为测试
        run: node --test --test-timeout=20000 test/behaviour.test.mjs

      - name: 校验 registry 上这个版本还没被占
        run: |
          pkg="$(node -e "process.stdout.write(require('./package.json').version)")"
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://registry.npmjs.org/dsh-im-workspace-buttons/$pkg")"
          if [ "$code" = "200" ]; then
            echo "dsh-im-workspace-buttons@$pkg 已在 registry 上，拒绝重复发布" >&2
            exit 1
          fi
          echo "registry 上 $pkg 尚不存在（HTTP $code），继续"

      - name: 发布到 npm
        run: npm publish --provenance --access public
